            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .contenido {
            width: min(90vw, 520px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transform: translateY(1vh);
        }

        .logo {
            width: clamp(145px, 16vw, 225px);
            height: clamp(145px, 16vw, 225px);
            object-fit: cover;
            border-radius: 50%;
            display: block;
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        .titulo {
            margin-top: 24px;
            color: #e9e9e9;
            font-size: clamp(1rem, 1.55vw, 1.35rem);
            font-weight: 400;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .boton-login {
            margin-top: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 126px;
            min-height: 48px;
            padding: 12px 23px;
            border: 0;
            border-radius: 8px;
            background: #f1f1f1;
            color: #171717;
            font-size: 0.98rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .boton-login:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
        }

        .boton-login:active {
            transform: translateY(0);
        }

        .boton-login:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.85);
            outline-offset: 4px;
        }

        .icono {
            width: 19px;
            height: 19px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .inicio {
                background-position: center center;
            }

            .contenido {
                width: min(88vw, 380px);
                transform: translateY(0);
            }

            .logo {
                width: 155px;
                height: 155px;
            }

            .titulo {
                margin-top: 20px;
                font-size: 1rem;
            }

            .boton-login {
                margin-top: 24px;
                min-width: 120px;
                min-height: 46px;
                padding: 11px 21px;
                font-size: 0.95rem;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .contenido {
                transform: scale(0.78);
            }
        }
    </style>
</head>
